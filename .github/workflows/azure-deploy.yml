name: Deploy to Azure Container Apps

# Runs after the CI quality gate's checks would apply to main, i.e. once code
# lands on main. Provisioning (resource group / Postgres / Container Apps env)
# is a one-time step done via scripts/azure-deploy.ps1 — this workflow only
# builds a new image and rolls it out to the existing Container App.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC login to Azure (azure/login)
  contents: read
  packages: write # required to push to ghcr.io

env:
  RESOURCE_GROUP: devresume-rg
  CONTAINER_APP: devresume-api
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devresume-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC — no stored client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out new image to the Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.IMAGE_NAME }}:${{ github.sha }}
