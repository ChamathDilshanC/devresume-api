name: Supabase Keep-Alive

# Free-tier Supabase projects pause after 7 days with no database activity.
# Running a trivial query daily keeps that timer from ever getting close.
on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Postgres
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client
          psql "$DATABASE_URL" -c "SELECT 1;"
