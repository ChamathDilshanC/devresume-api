[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/worker",
    "apps/cli",
    "shared",
    "crates/common",
    "crates/auth",
    "crates/github",
    "crates/parser",
    "crates/ai",
    "crates/resume",
    "crates/portfolio",
    "crates/ats",
    "crates/analytics",
    "crates/notification",
    "crates/search",
    "crates/storage",
    "crates/career",
    "crates/jobs",
    "crates/interview",
    "crates/learning",
    "crates/recommendation"
]

[workspace.package]
version = "0.2.0"
authors = ["ChamathDilshanC <dilshancolonne123@gmail.com>"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = "9.3"
bcrypt = "0.15"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["cors", "trace"] }
async-trait = "0.1"
urlencoding = "2.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"


